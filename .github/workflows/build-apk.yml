name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'kiyamulleyl-android-project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Projeyi hazirla
        run: |
          mkdir -p build_dir
          unzip -q kiyamulleyl-android-project.zip -d build_dir

      - name: APK derle
        working-directory: build_dir
        run: gradle assembleRelease --no-daemon

      - name: APK adini ayarla
        run: cp build_dir/app/build/outputs/apk/release/app-release.apk KiyamulLeyl.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KiyamulLeyl-apk
          path: KiyamulLeyl.apk

      - name: Release olustur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" KiyamulLeyl.apk \
            --title "Kiyamul-Leyl APK #${{ github.run_number }}" \
            --notes "Bu sayfadan KiyamulLeyl.apk dosyasini indirip kurabilirsin."
